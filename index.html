<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InTaxBD - Income Tax Return Filing in Bangladesh</title>
    <meta name="description" content="File your Bangladesh income tax return for assessment year 2026-27. Clear fees, 48-hour preparation, and support for individuals, freelancers, NRBs and businesses." />
    <meta name="theme-color" content="#F3F5F8" />

    <!-- Fonts: Bricolage Grotesque (display) + Public Sans (text, tabular figures for money) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Theme tokens: taken from the InTaxBD logo (navy, check-mark green, charcoal) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#F3F5F8',
              surface: '#FFFFFF',
              ink: '#0E1B33',
              muted: '#4B5870',
              rule: '#D6DCE5',
              brand: { DEFAULT: '#15409A', deep: '#0B2A6B' },
              leaf: { DEFAULT: '#7CB82F', deep: '#3F6B0C' },
              night: '#0A1630',
            },
            fontFamily: {
              display: ['"Bricolage Grotesque"', 'sans-serif'],
              sans: ['"Public Sans"', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <style>
      html { scroll-padding-top: 6rem; }
      body {
        background: #F3F5F8;
        color: #0E1B33;
        overflow-x: hidden;
        font-feature-settings: 'tnum' 1;
        -webkit-font-smoothing: antialiased;
      }

      /* Visible keyboard focus everywhere */
      :focus-visible {
        outline: 3px solid #15409A;
        outline-offset: 3px;
        border-radius: 4px;
      }
      .on-dark :focus-visible { outline-color: #7CB82F; }

      /* Fee slider: a green check-mark coloured thumb on a ruled track */
      .fee-range {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 36px;
        background: transparent;
        cursor: pointer;
      }
      .fee-range::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: #D6DCE5;
      }
      .fee-range::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: #D6DCE5;
      }
      .fee-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 28px;
        width: 28px;
        margin-top: -12px;
        border-radius: 50%;
        background: #7CB82F;
        border: 4px solid #FFFFFF;
        box-shadow: 0 0 0 2px #0E1B33;
      }
      .fee-range::-moz-range-thumb {
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #7CB82F;
        border: 4px solid #FFFFFF;
        box-shadow: 0 0 0 2px #0E1B33;
      }

      /* The one page-load moment: hero content rises in, staggered */
      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .rise { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .rise-1 { animation-delay: 0.08s; }
      .rise-2 { animation-delay: 0.18s; }
      .rise-3 { animation-delay: 0.3s; }
      @media (prefers-reduced-motion: reduce) {
        .rise { animation: none; }
        html { scroll-behavior: auto !important; }
      }

      /* Printing: the website is removed from the layout entirely (so no blank pages)
         and only the dedicated one-page checklist sheet is printed. */
      .print-only { display: none; }
      @media print {
        @page { size: A4; margin: 14mm 16mm; }
        html, body { background: #fff !important; }
        #root { display: none !important; }
        .print-only { display: block !important; }
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
